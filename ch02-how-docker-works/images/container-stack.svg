<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="429" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="440" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">컨테이너(소프트웨어 + 유저랜드) → 커널 → 하드웨어</text>

  <!-- Containers -->
  <rect x="40" y="66" width="240" height="128" rx="12" fill="#e8f4fd" stroke="#2496ed" stroke-width="1.5"/>
  <text x="160" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6fb8">컨테이너 A</text>
  <rect x="56" y="100" width="208" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="160" y="124" text-anchor="middle" font-size="13" fill="#0f172a">소프트웨어 (MySQL 등)</text>
  <rect x="56" y="144" width="208" height="38" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="160" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">유저랜드</text>

  <rect x="320" y="66" width="240" height="128" rx="12" fill="#e8f4fd" stroke="#2496ed" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6fb8">컨테이너 B</text>
  <rect x="336" y="100" width="208" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="124" text-anchor="middle" font-size="13" fill="#0f172a">소프트웨어 (nginx 등)</text>
  <rect x="336" y="144" width="208" height="38" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="440" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">유저랜드</text>

  <rect x="600" y="66" width="240" height="128" rx="12" fill="#e8f4fd" stroke="#2496ed" stroke-width="1.5"/>
  <text x="720" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6fb8">컨테이너 C</text>
  <rect x="616" y="100" width="208" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="720" y="124" text-anchor="middle" font-size="13" fill="#0f172a">소프트웨어 (PostgreSQL 등)</text>
  <rect x="616" y="144" width="208" height="38" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="720" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">유저랜드</text>

  <line x1="160" y1="194" x2="160" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="194" x2="440" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="194" x2="720" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="228" font-size="12" fill="#64748b">명령을 전달한다</text>

  <!-- Kernel -->
  <rect x="40" y="250" width="800" height="62" rx="10" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="440" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">리눅스 커널 (하나를 모두 함께 쓴다)</text>
  <text x="440" y="298" text-anchor="middle" font-size="12" fill="#9f1239">하드웨어를 실제로 다루는 부분 — 컨테이너 안에는 들어 있지 않다</text>

  <line x1="440" y1="312" x2="440" y2="344" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hardware -->
  <rect x="40" y="348" width="800" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="440" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">하드웨어 (CPU · 메모리 · 디스크)</text>

  <text x="440" y="420" text-anchor="middle" font-size="12.5" fill="#475569"><tspan font-weight="700" fill="#a16207">유저랜드</tspan> = 커널이 해주는 일을 사람이 실제로 쓸 수 있게 감싸주는 부분</text>
</svg>
