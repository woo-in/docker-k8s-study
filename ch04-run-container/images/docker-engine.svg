<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="440" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">도커 엔진 — 명령을 처리하는 창구이자 인프라 관리자</text>

  <!-- Terminal -->
  <rect x="36" y="140" width="190" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="131" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">터미널</text>
  <rect x="54" y="190" width="154" height="32" rx="6" fill="#0f172a"/>
  <text x="131" y="211" text-anchor="middle" font-size="12" fill="#e2e8f0" font-family="monospace">$ docker ...</text>
  <text x="131" y="240" text-anchor="middle" font-size="11.5" fill="#64748b">명령을 입력</text>

  <line x1="226" y1="180" x2="288" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="257" y="170" text-anchor="middle" font-size="11.5" fill="#64748b">명령</text>
  <line x1="288" y1="212" x2="226" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="257" y="232" text-anchor="middle" font-size="11.5" fill="#64748b">결과 · 로그</text>

  <!-- Docker engine -->
  <rect x="292" y="96" width="210" height="200" rx="12" fill="#e8f4fd" stroke="#2496ed" stroke-width="2"/>
  <text x="397" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1d6fb8">도커 엔진</text>
  <text x="397" y="154" text-anchor="middle" font-size="12" fill="#64748b">도커 명령을 실제로 처리</text>
  <rect x="310" y="170" width="174" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="397" y="191" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">창구</text>
  <text x="397" y="211" text-anchor="middle" font-size="11.5" fill="#475569">생성 · 목록 · 로그 명령</text>
  <rect x="310" y="228" width="174" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="397" y="249" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">인프라 관리자</text>
  <text x="397" y="269" text-anchor="middle" font-size="11.5" fill="#475569">세팅하고 관리한다</text>

  <line x1="502" y1="140" x2="566" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="502" y1="176" x2="566" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="502" y1="212" x2="566" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="502" y1="248" x2="566" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Managed resources -->
  <rect x="570" y="86" width="270" height="52" rx="10" fill="#e8f4fd" stroke="#2496ed"/>
  <text x="705" y="117" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d6fb8">컨테이너</text>
  <rect x="570" y="150" width="270" height="52" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="705" y="181" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a16207">이미지 저장</text>
  <rect x="570" y="214" width="270" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="705" y="245" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">네트워크</text>
  <rect x="570" y="278" width="270" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="705" y="309" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">볼륨</text>

  <text x="440" y="372" text-anchor="middle" font-size="12.5" fill="#475569">사용자는 <tspan font-weight="700" fill="#2563eb">도커 엔진</tspan>에만 말을 걸고, 실제 인프라는 엔진이 알아서 세팅하고 관리한다</text>
</svg>
