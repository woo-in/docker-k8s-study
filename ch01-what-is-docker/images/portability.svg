<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="329" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="440" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">격리된 환경이라, 그대로 옮겨 쓸 수 있다</text>

  <!-- Source -->
  <rect x="40" y="124" width="230" height="100" rx="12" fill="#e8f4fd" stroke="#2496ed" stroke-width="1.5"/>
  <text x="155" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#1d6fb8">똑같이 튜닝한 컨테이너</text>
  <text x="155" y="192" text-anchor="middle" font-size="12" fill="#64748b">내가 세팅한 상태 그대로</text>

  <line x1="270" y1="174" x2="556" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="174" x2="556" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="174" x2="556" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Targets -->
  <rect x="560" y="64" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="580" y="90" font-size="14" font-weight="700" fill="#0f172a">팀원 A 노트북</text>
  <text x="580" y="110" font-size="12" fill="#2563eb">개발 환경</text>
  <rect x="720" y="80" width="100" height="28" rx="14" fill="#e8f4fd" stroke="#2496ed"/>
  <text x="770" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#1d6fb8">컨테이너</text>

  <rect x="560" y="144" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="580" y="170" font-size="14" font-weight="700" fill="#0f172a">팀원 B 노트북</text>
  <text x="580" y="190" font-size="12" fill="#2563eb">개발 환경</text>
  <rect x="720" y="160" width="100" height="28" rx="14" fill="#e8f4fd" stroke="#2496ed"/>
  <text x="770" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#1d6fb8">컨테이너</text>

  <rect x="560" y="224" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="580" y="250" font-size="14" font-weight="700" fill="#0f172a">운영 서버</text>
  <text x="580" y="270" font-size="12" fill="#b45309">운영 환경</text>
  <rect x="720" y="240" width="100" height="28" rx="14" fill="#e8f4fd" stroke="#2496ed"/>
  <text x="770" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#1d6fb8">컨테이너</text>

  <text x="440" y="314" text-anchor="middle" font-size="13.5" fill="#475569">팀원 전원이 <tspan font-weight="700" fill="#2563eb">동일한 개발 환경</tspan>을 쓰고, <tspan font-weight="700" fill="#b45309">운영 환경</tspan>으로도 쉽게 넘어간다</text>
</svg>
