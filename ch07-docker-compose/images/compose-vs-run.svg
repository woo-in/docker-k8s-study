<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2496ed"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="403" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="440" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">도커 컴포즈 — docker run 여러 개를 정의 파일 하나로</text>

  <!-- Left: manual commands -->
  <rect x="36" y="64" width="360" height="232" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="216" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">사람이 명령어를 하나씩 입력</text>

  <rect x="52" y="104" width="328" height="148" rx="10" fill="#0f172a"/>
  <g font-family="monospace" font-size="12" fill="#e2e8f0">
    <text x="68" y="136">$ docker network create demo-net</text>
    <text x="68" y="162">$ docker volume create db-data</text>
    <text x="68" y="188">$ docker run -d --net demo-net mysql</text>
    <text x="68" y="214">$ docker run --net demo-net flyway</text>
    <text x="68" y="240" fill="#94a3b8">$ docker stop … / docker rm …</text>
  </g>
  <text x="216" y="278" text-anchor="middle" font-size="12" fill="#64748b">순서 · 옵션을 매번 기억하고 직접 입력해야 한다</text>

  <!-- Arrow -->
  <line x1="400" y1="178" x2="478" y2="178" stroke="#2496ed" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="440" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#2496ed">모아서 기재</text>

  <!-- Right: compose file -->
  <rect x="484" y="64" width="360" height="232" rx="12" fill="#e8f4fd" stroke="#2496ed"/>
  <text x="664" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6fb8">docker-compose.yml (정의 파일 · YAML)</text>

  <rect x="500" y="104" width="328" height="148" rx="10" fill="#0f172a"/>
  <g font-family="monospace" font-size="11.5" fill="#e2e8f0">
    <text x="516" y="124" fill="#7dd3fc">services:</text>
    <text x="530" y="139">mysql:</text>
    <text x="544" y="154">image: mysql:8.0</text>
    <text x="530" y="169">flyway:</text>
    <text x="544" y="184">image: redgate/flyway</text>
    <text x="544" y="199">depends_on:</text>
    <text x="558" y="214">- mysql</text>
    <text x="516" y="229" fill="#7dd3fc">volumes:</text>
    <text x="530" y="244">db-data:</text>
  </g>
  <text x="664" y="278" text-anchor="middle" font-size="12" fill="#1d4ed8">텍스트 파일 하나로 시스템 전체를 재현</text>

  <!-- Bottom: up / down -->
  <rect x="36" y="316" width="400" height="64" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="236" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" font-family="monospace">docker compose up -d</text>
  <text x="236" y="364" text-anchor="middle" font-size="12" fill="#166534">이미지 pull → 네트워크 · 볼륨 · 컨테이너 생성 및 실행</text>

  <rect x="444" y="316" width="400" height="64" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="644" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c" font-family="monospace">docker compose down</text>
  <text x="644" y="364" text-anchor="middle" font-size="12" fill="#991b1b">컨테이너 · 네트워크 정지 및 삭제 (볼륨은 -v 일 때만)</text>
</svg>
